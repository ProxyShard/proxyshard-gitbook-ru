servers:
  - url: https://user-api.proxyshard.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
      required:
        - success
        - message
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
          example: Datacenter Proxy
        location:
          type: string
          nullable: true
          example: DE
        cycle:
          type: string
          example: monthly
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 10
        promo_code:
          type: string
          nullable: true
          example: SAVE10
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - cycle
    PurchaseRequestDcIsp:
      type: object
      description: Покупка для Datacenter/ISP — поле location обязательно.
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
          example: Datacenter Proxy
        location:
          type: string
          example: DE
        cycle:
          type: string
          example: monthly
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 10
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - location
        - cycle
      x-gitbook-description-html: <p>Покупка для Datacenter/ISP — поле location обязательно.</p>
    PurchaseRequestResidentialStandard:
      type: object
      description: >-
        Покупка для Standart Residential Proxy — location не требуется; цикл
        фиксирован (lifetime).
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
          example: Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        promo_code:
          type: string
          nullable: true
      required:
        - product
      x-gitbook-description-html: >-
        <p>Покупка для Standart Residential Proxy — location не требуется; цикл
        фиксирован (lifetime).</p>
    PurchaseRequestResidentialPremium:
      type: object
      description: >-
        Покупка для Premium Residential Proxy — location не требуется; цикл
        фиксирован (lifetime).
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
          example: Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
        promo_code:
          type: string
          nullable: true
      required:
        - product
      x-gitbook-description-html: >-
        <p>Покупка для Premium Residential Proxy — location не требуется; цикл
        фиксирован (lifetime).</p>
    PurchaseRequestResidentialUnmetered:
      type: object
      description: Покупка для Unmetered Residential proxy — поддерживает авто-продление.
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
          example: Unmetered Residential proxy
        cycle:
          type: string
          example: monthly
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
      required:
        - product
        - cycle
      x-gitbook-description-html: >-
        <p>Покупка для Unmetered Residential proxy — поддерживает
        авто-продление.</p>
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order paid successfully
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: ISO8601/string date
          x-gitbook-description-html: <p>ISO8601/string date</p>
        status:
          type: string
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
          example: DE
        product:
          type: string
          example: dc
      required:
        - country
        - product
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: в центах
          x-gitbook-description-html: <p>в центах</p>
      required:
        - email
        - active_orders
        - wallet_balance
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          example: 5
          description: Объём в ГБ
          x-gitbook-description-html: <p>Объём в ГБ</p>
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          example: 0
          description: Смещение (по умолчанию 0)
          x-gitbook-description-html: <p>Смещение (по умолчанию 0)</p>
        limit:
          type: integer
          example: 20
          description: Размер страницы (по умолчанию 20)
          x-gitbook-description-html: <p>Размер страницы (по умолчанию 20)</p>
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
        name:
          type: string
        data:
          type: integer
          example: 5
          description: Объём в ГБ
          x-gitbook-description-html: <p>Объём в ГБ</p>
      required:
        - proxy_type
        - name
        - data
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      properties:
        proxy_type:
          type: string
          example: standart
        data:
          type: integer
          example: 5
          description: Объём в ГБ
          x-gitbook-description-html: <p>Объём в ГБ</p>
      required:
        - proxy_type
        - data
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: ISO country code
          x-gitbook-description-html: <p>ISO country code</p>
        name:
          type: string
          maxLength: 255
          description: Country name
          x-gitbook-description-html: <p>Country name</p>
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: Region code (state/province code)
          x-gitbook-description-html: <p>Region code (state/province code)</p>
        name:
          type: string
          maxLength: 255
          description: Region name (state/province name)
          x-gitbook-description-html: <p>Region name (state/province name)</p>
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: City code (usually slug format)
          x-gitbook-description-html: <p>City code (usually slug format)</p>
        name:
          type: string
          maxLength: 255
          description: City name
          x-gitbook-description-html: <p>City name</p>
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: Region code
              x-gitbook-description-html: <p>Region code</p>
            name:
              type: string
              maxLength: 255
              description: Region name
              x-gitbook-description-html: <p>Region name</p>
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
paths:
  /user/api/orders/purchase:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: Создать и оплатить заказ
      description: |
        Покупка по имени продукта, локации и циклу.
        Для Datacenter/ISP — location обязателен.
        Для Standart Residential Proxy — location не требуется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
            examples:
              datacenter:
                value:
                  product: Datacenter Proxy
                  location: DE
                  cycle: monthly
                  quantity: 10
                  auto_renewal: true
              isp:
                value:
                  product: ISP Proxy
                  location: US
                  cycle: monthly
                  quantity: 5
              residentialStandard:
                value:
                  product: Standart Residential Proxy
                  quantity: 1
              residentialPremium:
                value:
                  product: Premium Residential Proxy
                  quantity: 1
              residentialNew:
                value:
                  product: Residential Proxy NEW
                  cycle: monthly
                  quantity: 1
              unmeteredResidential:
                value:
                  product: Unmetered Residential proxy
                  cycle: monthly
                  auto_renewal: true
              mobile:
                value:
                  product: Mobile Proxy Plan Name
                  cycle: day
                  quantity: 1
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
          x-gitbook-description-html: <p>Успешно</p>
        '400':
          description: Ошибка валидации/баланса/недостаток стока
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Ошибка валидации/баланса/недостаток стока</p>
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Неавторизован</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      Покупка по имени продукта, локации и циклу. Для
                      Datacenter/ISP — location обязателен. Для Standart
                      Residential Proxy — location не требуется.
                    marks: []
                key: a6YDYJfLO9R9
            key: S5jpGa8ot9FH
        key: 7j57RKNQ66xt
      x-gitbook-description-html: >-
        <p>Покупка по имени продукта, локации и циклу. Для Datacenter/ISP —
        location обязателен. Для Standart Residential Proxy — location не
        требуется.</p>
  /user/api/orders/change-billing-cycle/{order_id}:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: Изменить биллинг-цикл заказа
      description: >
        Меняет цикл оплаты по названию цикла. Только для Datacenter & ISP
        прокси.

        Если промокод недоступен для выбранного цикла, он будет автоматически
        сброшен.
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cycle:
                  type: string
                  example: monthly
              required:
                - cycle
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  order:
                    type: object
          x-gitbook-description-html: <p>Успешно</p>
        '400':
          description: Неверный продукт или цикл
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Неверный продукт или цикл</p>
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Неавторизован</p>
        '403':
          description: Цикл недоступен для этого пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Цикл недоступен для этого пользователя</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      Меняет цикл оплаты по названию цикла. Только для
                      Datacenter & ISP прокси. Если промокод недоступен для
                      выбранного цикла, он будет автоматически сброшен.
                    marks: []
                key: FCRCqYnCRIMJ
            key: CstYjsmMFFpH
        key: RctxTbOKuya7
      x-gitbook-description-html: >-
        <p>Меняет цикл оплаты по названию цикла. Только для Datacenter &#x26;
        ISP прокси. Если промокод недоступен для выбранного цикла, он будет
        автоматически сброшен.</p>
  /user/api/orders/edit-auto-renewal/{order_id}:
    post:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: Изменить авто-продление заказа
      description: |
        Включить/выключить авто-продление. Только для Datacenter & ISP прокси.
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
        - in: query
          name: auto_renewal
          required: true
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
          x-gitbook-description-html: <p>Успешно</p>
        '400':
          description: Неверный продукт для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Неверный продукт для операции</p>
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Неавторизован</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      Включить/выключить авто-продление. Только для Datacenter &
                      ISP прокси.
                    marks: []
                key: K9SC5NGtClVi
            key: wsP9craixrO9
        key: lPUU4UXDZMgV
      x-gitbook-description-html: >-
        <p>Включить/выключить авто-продление. Только для Datacenter &#x26; ISP
        прокси.</p>
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      security:
        - bearerAuth: []
      summary: Получить активные прокси по заказу
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список прокси
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
          x-gitbook-description-html: <p>Список прокси</p>
        '403':
          description: Метод недоступен для этого заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-gitbook-description-html: <p>Метод недоступен для этого заказа</p>
  /user/api/proxies/products:
    get:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: Получить продукты и их циклы
      description: Возвращает продукты для API с названиями доступных циклов.
      responses:
        '200':
          description: Список продуктов
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductWithCycles'
                required:
                  - success
                  - products
          x-gitbook-description-html: <p>Список продуктов</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: Возвращает продукты для API с названиями доступных циклов.
                    marks: []
                key: ae0gjXUIoxK0
            key: H8DZM6car1fH
        key: dPLJyH3Xi2mm
      x-gitbook-description-html: <p>Возвращает продукты для API с названиями доступных циклов.</p>
  /user/api/proxies/available-count:
    get:
      tags:
        - General
      security:
        - bearerAuth: []
      summary: Узнать доступное количество прокси
      description: Возвращает суммарное доступное количество для всех продуктов.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableCountResponse'
          x-gitbook-description-html: <p>Успешно</p>
      x-gitbook-description-document:
        object: document
        data:
          schemaVersion: 9
        nodes:
          - object: block
            type: paragraph
            isVoid: false
            data: {}
            nodes:
              - object: text
                leaves:
                  - object: leaf
                    text: >-
                      Возвращает суммарное доступное количество для всех
                      продуктов.
