  /user/api/orders:
    get:
      tags:
        - General
      summary: Список заказов
      parameters:
        - in: query
          name: status
          required: true
          description: "активный | в ожидании | отменен | все"
          schema:
            type: string
        - in: query
          name: offset
          required: false
          description: Смещение выборки (по умолчанию 0)
          schema:
            type: integer
            minimum: 0
        - in: query
          name: limit
          required: false
          description: Размер страницы (1..100, по умолчанию 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
