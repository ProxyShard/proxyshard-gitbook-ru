  /user/api/proxies/analytics/{kind}:
    get:
      tags:
        - Residential Proxies
      summary: Статистика аккаунта
      description: |
        Статистика трафика самого аккаунта.

        `kind`:
        * `overall`: трафик и запросы по интервалам за период;
        * `domains`: трафик и запросы по хостам назначения за период;
        * `connections`: соединения, открытые прямо сейчас (без периода).

        По умолчанию учитывается только собственный трафик аккаунта. Передайте `include_sub_users=true`, чтобы добавить всех саб-пользователей аккаунта.
      parameters:
        - in: path
          name: kind
          required: true
          description: overall | domains | connections
          schema:
            type: string
            enum:
              - overall
              - domains
              - connections
        - in: query
          name: proxy_type
          required: true
          description: Тип прокси (standart | premium | unlimited)
          schema:
            type: string
        - in: query
          name: start
          required: false
          description: Начало окна, включительно (ISO 8601, `YYYY-MM-DD HH:MM:SS` или Unix timestamp). Для `connections` не учитывается.
          schema:
            type: string
        - in: query
          name: end
          required: false
          description: Конец окна, не включительно; по умолчанию текущий момент. Для `connections` не учитывается.
          schema:
            type: string
        - in: query
          name: timezone
          required: false
          description: Часовой пояс IANA для границ интервалов, по умолчанию UTC
          schema:
            type: string
        - in: query
          name: include_sub_users
          required: false
          description: Учитывать аккаунт вместе со всеми его саб-пользователями (по умолчанию false)
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          description: Размер страницы
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          description: Сколько результатов пропустить
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
