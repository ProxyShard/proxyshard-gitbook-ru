# ============================================================================
# ShardX User API: OpenAPI 3.0.3.
#
# ИСТОЧНИК ПРАВДЫ по публичному API. Раньше спека жила только в GitBook
# (docs.shardx.com/proxyshard-api/*), из-за чего расходилась с кодом
# незаметно: ответы ручек уже отдавали message и proxy_password, а спека
# продолжала обещать старую форму.
#
# Правила:
#   * добавил/изменил ручку в services/user-api - правь этот файл в ТОМ ЖЕ
#     коммите;
#   * теги = страницы в GitBook, менять их имена без нужды не стоит;
#   * после мержа залить файл в GitBook (OpenAPI-спека проекта), иначе
#     клиенты снова увидят устаревшее.
#
# Проверка перед заливкой:
#   python -m openapi_spec_validator services/user-api/openapi.yaml
# ============================================================================
openapi: 3.0.3
info:
  title: "Биллинг пользовательского API ShardX"
  version: 1.3.1
servers:
  - url: https://user-api.shardx.com
security:
  - bearerAuth: []
tags:
  - name: General
    description: Общие операции (профиль, заказы, справочники)
  - name: Datacenter & ISP Proxies
    description: Операции для датацентровых и ISP прокси
  - name: Residential Proxies
    description: Операции для резидентских прокси
  - name: Service
    description: "Зонды работоспособности (без аутентификации)"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: |
        Необязательный. Уникальный идентификатор логической операции (1–128 символов из `[A-Za-z0-9_.:-]`), например UUID.
        Повторяя запрос, исход которого неизвестен (таймаут, обрыв соединения), отправляйте ТОТ ЖЕ ключ: уже выполненный запрос НЕ выполняется повторно, возвращается его исходный ответ.

        Принимается на ВСЕХ изменяющих методах (`POST`/`PUT`/`PATCH`/`DELETE`) этого API: покупка, продление, докупка трафика, дополнения и любые методы, добавленные позже; явно указан на методах, которые списывают деньги.

        * Все методы, кроме операций с саб-пользователями: сохранённый ответ возвращается повторно с заголовком `Idempotency-Replayed: true` в течение 7 дней. `409`: запрос с этим ключом ещё выполняется (`idempotency_state: in_progress`) или не завершился, и его исход нужно проверить вручную (`idempotency_state: unknown`; повторно он не выполняется). `422`: ключ уже использован с другим запросом. Ответ `429` от ограничителя частоты ключ не расходует, повторяйте с тем же ключом.
        * Методы саб-пользователей (создание, `data/add`, `data/subtract`): ключ передаётся провайдеру прокси, и повтор в течение 24 часов не изменит квоту дважды. `409`: операция ещё выполняется или ключ использован с другими данными.

        Без заголовка запросы выполняются как обычно, без этих гарантий.
      schema:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
  responses:
    BadRequest:
      description: |
        Некорректный запрос; причина в `message`. Большинство проверок отвечает JSON (`ApiError`), некоторые отвечают простым текстом (`Content-Type: text/plain`): `Invalid proxy type`, `User don't have active order with this proxy type`, `User resident not set for user` (методы резидентских прокси), `Addon not available for this product`, `Invalid addons_json` и проверки количества дополнений (методы дополнений, покупка и расчёт с дополнениями), а также ошибки прокси-сервера в `signature/set` и `del-np/set`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
        text/plain:
          schema:
            type: string
            example: Invalid proxy type
    Unauthorized:
      description: 'Нет API-ключа или он недействителен: `Missing or invalid Authorization header`, `Invalid API key`, `API key mismatch`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServerError:
      description: |
        Внутренняя ошибка. `500` приходит и тогда, когда заказ (или другая нужная запись) не найден или не принадлежит вашему аккаунту; что именно, сказано в `message`, например `Order not found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: 'Провайдер прокси недоступен или ответил ошибкой (`Upstream error: <status>`)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: |
        Больше одного запроса за 3 секунды от аккаунта. Тело ответа простым текстом (`Too many requests, retry in <N>s`), в заголовке `x-ratelimit-after` время ожидания в секундах. Idempotency-Key не расходуется: повторяйте с тем же ключом.
      content:
        text/plain:
          schema:
            type: string
            example: Too many requests, retry in 2s
    IdempotencyConflict:
      description: |
        Запрос с этим Idempotency-Key ещё выполняется (`idempotency_state: in_progress`) или не завершился, и его исход нужно проверить вручную (`idempotency_state: unknown`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    IdempotencyMismatch:
      description: Этот Idempotency-Key уже использован с другим запросом
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActiveProxyItem:
      type: object
      properties:
        ip:
          type: string
        username:
          type: string
        password:
          type: string
        http_port:
          type: integer
        socks_port:
          type: integer
        until:
          type: string
          description: "Строка даты ISO 8601"
        status:
          type: string
        signature:
          type: string
          nullable: true
          description: "подпись p0f, назначенная IP-адресу, ноль, если не установлена"
      required:
        - ip
        - username
        - password
        - http_port
        - socks_port
        - until
        - status
    ApiError:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        rejected:
          type: boolean
          description: 'Операции с саб-пользователями: `true`, если провайдер отклонил операцию и ничего не изменилось'
        idempotency_state:
          type: string
          enum:
            - in_progress
            - unknown
          description: Только в `409` от проверки Idempotency-Key
        order_id:
          type: integer
          description: 'Только в `502` от покупки и add-bandwidth: оплаченный заказ'
        refunded:
          type: boolean
          description: 'Только в `502` от покупки и add-bandwidth: `true`, если оплата вернулась на кошелёк, `false`, если возврат ещё не прошёл (обратитесь в поддержку)'
      required:
        - success
        - message
    AddonLine:
      type: object
      description: "Одна строка дополнения, сохраненная в заказе"
      properties:
        addon_key:
          type: string
        catalog_id:
          type: integer
        qty:
          type: integer
          description: "Активные единицы за текущий период"
        price_per_unit:
          type: integer
          description: "Цена за единицу в центах на момент покупки"
        pending:
          description: "Изменение запланировано на следующее продление или `null`"
          nullable: true
          type: object
          properties:
            action:
              type: string
              enum:
                - cancel
                - downgrade
            next_qty:
              type: integer
              description: "Целевое количество после понижения"
    PurchaseRequestDcIsp:
      type: object
      description: "Покупка для Datacenter/ISP; поле location обязательно."
      properties:
        product:
          type: string
          enum:
            - Datacenter Proxy
            - ISP Proxy
        location:
          type: string
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Дополнения, прикрепляемые во время покупки, например `p0f_slots` для DC или ISP."
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - location
        - cycle
    PurchaseRequestResidentialStandard:
      type: object
      description: "Покупка для Standart Residential Proxy; location не требуется; цикл фиксирован (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Standart Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Дополнения, прикрепляемые во время покупки, например `p0f_slots` для DC или ISP."
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialPremium:
      type: object
      description: "Покупка для Premium Residential Proxy; location не требуется; цикл фиксирован (lifetime)."
      properties:
        product:
          type: string
          enum:
            - Premium Residential Proxy
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        addons:
          type: array
          nullable: true
          description: "Дополнения, прикрепляемые во время покупки, например `p0f_slots` для DC или ISP."
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
    PurchaseRequestResidentialUnmetered:
      type: object
      description: "Покупка для Unmetered Residential proxy; поддерживает авто-продление."
      properties:
        product:
          type: string
          enum:
            - Unmetered Residential proxy
        cycle:
          type: string
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Дополнения, прикрепляемые во время покупки, например `p0f_slots` для DC или ISP."
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseRequest:
      type: object
      properties:
        product:
          type: string
        location:
          type: string
          nullable: true
        cycle:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        promo_code:
          type: string
          nullable: true
        auto_renewal:
          type: boolean
          default: false
        addons:
          type: array
          nullable: true
          description: "Дополнения, прикрепляемые во время покупки, например `p0f_slots` для DC или ISP."
          items:
            $ref: '#/components/schemas/CreateOrderAddonRequest'
      required:
        - product
        - cycle
    PurchaseResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        order_id:
          type: integer
      required:
        - success
        - message
        - order_id
    ProductWithCycles:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        cycles:
          type: array
          items:
            type: string
      required:
        - name
        - cycles
    AvailableCountResponse:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
        amount:
          type: integer
      required:
        - country
        - product
        - amount
    ApiMeResponse:
      type: object
      properties:
        email:
          type: string
        active_orders:
          type: integer
        wallet_balance:
          type: integer
          description: в центах
      required:
        - email
        - active_orders
        - wallet_balance
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AvailableCountRequest:
      type: object
      properties:
        country:
          type: string
        product:
          type: string
      required:
        - country
        - product
    AddBandwidthRequest:
      type: object
      properties:
        amount:
          type: integer
          description: Объём в ГБ (1 ГБ = 1 073 741 824 байт), не больше 100 000
        promo_code:
          type: string
          nullable: true
      required:
        - amount
    GetSubUsersRequest:
      type: object
      properties:
        offset:
          type: integer
          description: Смещение (по умолчанию 0)
        limit:
          type: integer
          description: Размер страницы (по умолчанию 20)
    EditSubUserPayload:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateSubUserPayload:
      type: object
      description: Нужно указать `data` или `data_bytes`; при обоих используется `data_bytes`.
      properties:
        proxy_type:
          type: string
        name:
          type: string
        data:
          type: integer
          description: Объём в ГБ (1 ГБ = 1 073 741 824 байт), не больше 100 000
        data_bytes:
          type: integer
          format: int64
          description: Объём в байтах (точно; приоритетнее `data`), не больше 100 000 ГБ
      required:
        - proxy_type
        - name
    ChangeSubUserPasswordPayload:
      type: object
      properties:
        proxy_type:
          type: string
      required:
        - proxy_type
    ModifyTrafficPayload:
      type: object
      description: Нужно указать `data` или `data_bytes`; при обоих используется `data_bytes`.
      properties:
        proxy_type:
          type: string
        data:
          type: integer
          description: Объём в ГБ (1 ГБ = 1 073 741 824 байт), не больше 100 000
        data_bytes:
          type: integer
          format: int64
          description: Объём в байтах (точно; приоритетнее `data`), не больше 100 000 ГБ
      required:
        - proxy_type
    AnalyticsSeries:
      type: object
      description: |
        Ответ провайдера без изменений. Его вид зависит от `kind`:
        * `overall`: `results` содержат интервалы времени `{timestamp, data, requests}`, пустые интервалы приходят с нулями; на коротком окне интервалы почасовые, на длинном посуточные;
        * `domains`: `results` содержат хосты `{hostname, data, requests}` по убыванию `data`; `count` нет;
        * `connections`: `results` содержат открытые сейчас соединения `{user_id, package_id, server_ip, connections}`; периода (`timezone`, `start`, `end`) нет.
      properties:
        count:
          type: integer
          description: Всего результатов (`overall`)
        next:
          type: string
          nullable: true
          description: Ссылка на следующую страницу
        previous:
          type: string
          nullable: true
          description: Ссылка на предыдущую страницу
        timezone:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                description: Начало интервала (`overall`)
              hostname:
                type: string
                description: Хост назначения (`domains`)
              data:
                type: integer
                format: int64
                description: Байты (`overall`, `domains`)
              requests:
                type: integer
                description: Запросы (`overall`, `domains`)
              user_id:
                type: string
                description: ID аккаунта или саб-пользователя (`connections`)
              package_id:
                type: string
                description: ID пакета (`connections`)
              server_ip:
                type: string
                description: IP шлюза, на котором открыты соединения (`connections`)
              connections:
                type: integer
                description: Открытых соединений (`connections`)
    SubUserOrderState:
      type: object
      nullable: true
      description: Состояние квоты саб-пользователя ПОСЛЕ операции (null, если провайдер не вернул заказ)
      properties:
        proxy_password:
          type: string
        data:
          type: integer
          format: int64
          description: Выделенная квота в байтах
        data_spent:
          type: integer
          format: int64
          description: Израсходовано байт
        data_remain:
          type: integer
          format: int64
          description: Осталось байт (при перерасходе может быть отрицательным)
    Country:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: "Код страны ISO"
        name:
          type: string
          maxLength: 255
          description: "Название страны"
      required:
        - code
        - name
    Region:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
          description: "Код региона или штата"
        name:
          type: string
          maxLength: 255
          description: "Название региона или штата"
        country:
          $ref: '#/components/schemas/Country'
      required:
        - code
        - name
        - country
    City:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: "Код города, обычно в формате slug"
        name:
          type: string
          maxLength: 255
          description: "Название города"
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              maxLength: 10
              description: "Код региона"
            name:
              type: string
              maxLength: 255
              description: "Название региона"
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedCountriesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      required:
        - count
        - results
    PagedRegionsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Region'
      required:
        - count
        - results
    PagedCitiesResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - count
        - results
    Isp:
      type: object
      properties:
        code:
          type: string
          description: "Код интернет-провайдера, обычно в формате slug"
        name:
          type: string
          description: "Имя интернет-провайдера"
        country:
          $ref: '#/components/schemas/Country'
        region:
          type: object
          nullable: true
          properties:
            code:
              type: string
              description: "Код региона"
            name:
              type: string
              description: "Название региона"
          required:
            - code
            - name
      required:
        - code
        - name
        - country
    PagedIspsResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Isp'
      required:
        - count
        - results
    CreateOrderAddonRequest:
      type: object
      properties:
        addon_key:
          type: string
          example: p0f_slots
        qty:
          type: integer
          minimum: 1
      required:
        - addon_key
        - qty
paths:
  /user/api/proxies/active:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: Получить активные прокси по заказу
      parameters:
        - in: query
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список прокси
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProxyItem'
                  order_tag:
                    type: string
                    nullable: true
                required:
                  - success
                  - data
        '400':
          description: У заказа ещё нет данных доступа к прокси (`Missing authtoken in order`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Метод недоступен для этого заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /user/api/orders/{order_id}/del-np/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Установить удаление для каждого IP-адреса (del-np)"
      description: |
        Только для прокси дата-центров и ISP.
        Отмеченные прокси работают до конца оплаченного периода и удаляются при следующем продлении. Поля заказа `quantity` и `price_paid` сейчас НЕ меняются: продление списывает плату за оставшиеся прокси (пропорциональную долю цены заказа) и затем обновляет их. См. `renewal_quantity` и `renewal_price` в GET /user/api/orders/{order_id}.
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                      value:
                        type: boolean
                    required:
                      - ip
                      - value
              required:
                - items
      responses:
        '200':
          description: "Успех"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: "Ошибка проверки, не DC-ISP или `keep=0`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/signature/set:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Установить отпечаток ОС для IP"
      description: "Устанавливает подпись отпечатка ОС для одного или нескольких IP-адресов прокси.  \nТребуется, чтобы дополнение `p0f_slots` было активным для заказа.\n\nКаждый IP, получивший подпись, постоянно занимает один слот. Изменение значения ОС на IP-адресе, который уже имеет подпись, не требует дополнительного слота.\n\n**Доступные значения подписи:**\n\n| Значение | ОС |\n|-------|----|\n| `ios` | iOS |\n| `macos` | macOS |\n| `android` | Android |\n| `linux` | Linux |\n| `win10` | Windows 10 |\n| `win11` | Windows 11 |"
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - ip
                      - signature
                    properties:
                      ip:
                        type: string
                      signature:
                        type: string
                        description: "Идентификатор ОС для подделки."
                        enum:
                          - ios
                          - macos
                          - android
                          - linux
                          - win10
                          - win11
      responses:
        '200':
          description: "Успех"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  updated:
                    type: integer
                    description: "Количество обновленных IP-адресов"
        '400':
          description: "Ошибка валидации или недостаточно слотов"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/calculate:
    get:
      tags:
        - Datacenter & ISP Proxies
      summary: "Рассчитать дополнительную стоимость"
      description: "Возвращает предварительный просмотр цены на приобретение дополнительных единиц данного дополнения для активного заказа центра обработки данных или интернет-провайдера. В настоящее время поддерживается только дополнительный ключ `p0f_slots`; Слоты для подписи отпечатков пальцев ОС."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "Идентификатор заказа"
          schema:
            type: integer
        - in: query
          name: addon_key
          required: true
          description: "Идентификатор дополнения (например, `p0f_slots`)"
          schema:
            type: string
        - in: query
          name: add_qty
          required: true
          description: "Количество единиц для добавления"
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: "Предварительный просмотр цены"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  addon_key:
                    type: string
                  catalog_id:
                    type: integer
                  price_per_unit:
                    type: integer
                    description: "Цена за единицу в центах"
                  current_qty:
                    type: integer
                  add_qty:
                    type: integer
                  new_qty:
                    type: integer
                  add_total:
                    type: integer
                    description: "Общая сумма за эту покупку в центах"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/purchase:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Купить дополнение"
      description: |
        Списывает средства с кошелька и добавляет к заказу указанное количество единиц дополнения. Заказ должен иметь статус **active**. Сейчас доступен только ключ `p0f_slots`.
        Отправляйте заголовок `Idempotency-Key`, чтобы повтор был безопасен (списываются деньги).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: order_id
          required: true
          description: "Идентификатор заказа"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - add_qty
              properties:
                addon_key:
                  type: string
                add_qty:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: "Дополнение куплено"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons_price_paid:
                    type: integer
                    description: "Совокупная дополнительная стоимость для этого заказа (центы)"
                  addons:
                    type: array
                    description: "Обновленный список дополнений, хранящийся в заказе."
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Одновременно шло другое изменение дополнений этого заказа (повторите), или запрос с этим Idempotency-Key ещё выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Запланировать понижение версии дополнения"
      description: "Планирует **понижение** дополнения на следующий цикл продления. Новое количество должно быть меньше текущего. Изменение сохраняется как маркер `pending` и применяется автоматически при продлении заказа."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "Идентификатор заказа"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
                - action
              properties:
                addon_key:
                  type: string
                action:
                  type: string
                  description: '`downgrade`: уменьшить количество при следующем продлении; `cancel`: убрать дополнение при следующем продлении'
                  enum:
                    - downgrade
                    - cancel
                next_qty:
                  type: integer
                  description: 'Обязателен для `downgrade`: количество после продления, меньше текущего (0 убирает все единицы)'
                  minimum: 0
      responses:
        '200':
          description: "Понижение запланировано"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{order_id}/addons/schedule/cancel:
    post:
      tags:
        - Datacenter & ISP Proxies
      summary: "Отменить запланированный переход на более раннюю версию"
      description: "Удаляет ожидающее понижение версии, установленное через конечную точку расписания."
      parameters:
        - in: path
          name: order_id
          required: true
          description: "Идентификатор заказа"
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addon_key
              properties:
                addon_key:
                  type: string
      responses:
        '200':
          description: "Запланированное понижение отменено"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  addons:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddonLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/purchase:
    post:
      tags:
        - General
      summary: Создать и оплатить заказ
      description: |
        Покупка по имени продукта, локации и циклу.
        Для Datacenter/ISP location обязателен.
        Для Standart Residential Proxy location не требуется.

        Отправляйте заголовок `Idempotency-Key`, чтобы повтор был безопасен: без него повтор после таймаута может дважды списать деньги и выдать прокси.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PurchaseRequestDcIsp'
                - $ref: '#/components/schemas/PurchaseRequestResidentialStandard'
                - $ref: '#/components/schemas/PurchaseRequestResidentialPremium'
                - $ref: '#/components/schemas/PurchaseRequestResidentialUnmetered'
                - $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Ошибка валидации/баланса/недостаток стока
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Этот платёжный цикл недоступен для вашего аккаунта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: Не удалось проверить наличие, или прокси не выдались после оплаты; тогда `order_id` и `refunded` показывают, вернулась ли оплата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/api/orders/calculate:
    get:
      tags:
        - General
      summary: "Рассчитать стоимость заказа"
      description: "Рассчитывает цену по названию продукта, названию цикла и количеству. Использует те же правила проверки, что и при покупке (разрешенные платежные циклы, правила промоакций)."
      parameters:
        - in: query
          name: product
          required: true
          schema:
            type: string
        - in: query
          name: location
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: cycle
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: quantity
          required: false
          schema:
            type: integer
            nullable: true
        - in: query
          name: promo_code
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: addons_json
          required: false
          description: "Массив дополнений в URL-кодированном JSON, например [{\"addon_key\":\"p0f_slots\",\"qty\":5}]"
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: "Успех"
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_price:
                    type: integer
                  final_price:
                    type: integer
                  discount_percent:
                    type: integer
                  addons_price:
                    type: integer
                    description: "Общая стоимость дополнений в минимальных единицах"
                  total_with_addons:
                    type: integer
                    description: "final_price + addons_price"
        '400':
          description: "Ошибка проверки"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: "Требуется авторизация"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Этот платёжный цикл недоступен для вашего аккаунта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/change-billing-cycle/{order_id}:
