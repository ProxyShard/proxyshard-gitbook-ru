  /user/api/proxies/sub-user:
    post:
      tags:
        - Residential Proxies
      summary: Создать саб-пользователя
      description: |
        Квота задаёт виртуальный лимит поверх общего пула трафика аккаунта: её назначение не списывает трафик из пула, трафик расходуется только когда саб-пользователь реально пользуется прокси.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: query
          name: proxy_type
          required: true
          description: Тип прокси (standart | premium | unlimited)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Нужно указать `data` или `data_bytes`; при обоих используется `data_bytes`.
              properties:
                name:
                  type: string
                data:
                  type: integer
                  description: Объём в ГБ (1 ГБ = 1 073 741 824 байт), не больше 100 000
                data_bytes:
                  type: integer
                  format: int64
                  description: Объём в байтах (точно; приоритетнее `data`), не больше 100 000 ГБ
              required:
                - name
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        first_name:
                          type: string
                        proxy_password:
                          type: string
                        data:
                          type: integer
                        data_spent:
                          type: integer
                        data_remain:
                          type: integer
                      required:
                        - user_id
                        - first_name
                        - proxy_password
                        - data
                        - data_spent
        '400':
          description: 'Ошибка проверки, или провайдер отклонил запрос (`rejected: true`); ничего не создано'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Запрос с этим Idempotency-Key ещё выполняется или ключ использован с другими данными
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          description: 'Провайдер недоступен: исход НЕИЗВЕСТЕН; повторите с тем же Idempotency-Key'
          content:
            application/json:
              schema:
