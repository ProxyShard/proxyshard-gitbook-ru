  /user/api/proxies/isps:
    get:
      tags:
        - Residential Proxies
      summary: "Список интернет-провайдеров"
      description: "Интернет-провайдеры, доступные внутри города; четвертый уровень таргетинга после страны, региона и города. В отличие от других конечных точек местоположения, для этой требуется полная цепочка: `country_code`, `region_code` и `city_code` необходимы, поскольку вышестоящие интернет-провайдеры привязаны к городу. Только пакет «Премиум»: каталог интернет-провайдеров не поддерживается для стандартных и безлимитных пакетов, а любой другой `proxy_type` отклоняется с кодом 400. Интернет-провайдеры указаны только для крупных городов, поэтому пустой `results` с `count: 0` является нормальным ответом для меньшего города."
      parameters:
        - in: query
          name: proxy_type
          required: true
          description: "Должно быть `premium`; Таргетинг на интернет-провайдеров доступен только для премиум-класса."
          schema:
            type: string
            enum:
              - premium
        - in: query
          name: country_code
          required: true
          description: "Код страны ISO"
          schema:
            type: string
        - in: query
          name: region_code
          required: true
          description: "Код региона или штата"
          schema:
            type: string
        - in: query
          name: city_code
          required: true
          description: "Код города из GET /user/api/proxy/cities."
          schema:
            type: string
      responses:
        '200':
          description: "Успех"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIspsResponse'
        '400':
          description: "proxy_type не `premium`, резидентность пользователя не установлена ​​или у пользователя нет активного заказа на пакет."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notPremium:
                  value:
                    success: false
                    message: ISP targeting is available for the premium package only
        '401':
          description: "Требуется авторизация"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
