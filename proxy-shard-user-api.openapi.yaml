                        items:
                          $ref: '#/components/schemas/AddonLine'
                      p0f_slots_available:
                        type: integer
                        description: "Активные слоты для подписи p0f (из дополнений)"
                      p0f_slots_used:
                        type: integer
                        description: "Слоты, в настоящее время занятые подписанными прокси"
                      p0f_slots_next:
                        type: integer
                        description: Слоты, которые будут активны после следующего продления (не больше renewal_quantity)
                      renewal_quantity:
                        type: integer
                        description: Прокси в следующем периоде (меньше quantity, если часть отмечена del-np)
                      renewal_price:
                        type: integer
                        description: Сколько спишет следующее продление, в центах (renewal_base_price + renewal_addons_price)
                      renewal_base_price:
                        type: integer
                        description: Часть следующего продления за прокси, в центах (пропорциональная доля price_paid)
                      renewal_addons_price:
                        type: integer
                        description: Часть следующего продления за дополнения, в центах (с учётом запланированных изменений)
                      status:
                        type: string
                      created_at:
                        type: string
                        nullable: true
                      expires_at:
                        type: string
                        nullable: true
                      promo_code:
                        type: string
                        nullable: true
                      auto_renewal:
                        type: boolean
                        nullable: true
                      tag:
                        type: string
                        nullable: true
                required:
                  - success
                  - order
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /user/api/orders/{id}/renew:
    post:
      tags:
        - General
      summary: Продлить заказ
      description: |
        Продление доступно только при статусе заказа `on-hold`.
        Повторный запрос для уже продлённого заказа отвечает `200` с `Order already renewed`.
        Отправляйте заголовок `Idempotency-Key`, чтобы повтор был безопасен (списываются деньги).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Order renewed successfully
                required:
                  - success
                  - message
        '400':
          description: Недостаточный баланс/валидация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Заказ уже оплачен за текущий период, изменился во время продления (повторите), или запрос с этим Idempotency-Key ещё выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/IdempotencyMismatch'
        '500':
          $ref: '#/components/responses/ServerError'
