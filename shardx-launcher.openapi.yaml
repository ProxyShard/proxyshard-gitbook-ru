openapi: 3.0.3

info:
  title: "ShardX Browser; Automation API"
  version: "0.1.0"
  description: "Локальный HTTP API для автоматизации антидетект-браузера ShardX:\nгенерация отпечатков, создание/запуск/остановка профилей, получение\nChrome DevTools Protocol (CDP) WebSocket-эндпоинта для управления\nзапущенным профилем через Puppeteer / Playwright.\n\n## Привязка и жизненный цикл\nСервер работает внутри приложения-лаунчера, слушает только **127.0.0.1**\nна порту, заданном в *Settings → Automation API* (по умолчанию **40325**).\nС других хостов он **недоступен**. Изменение порта и включение/выключение\nвступают в силу после перезапуска приложения.\n\n## Аутентификация\nВсе эндпоинты, кроме `GET /health`, требуют **Bearer JWT** (HS256,\nподписанный секретом лаунчера):\n\n    Authorization: Bearer <token>\n\nПостоянный токен отображается в *Settings → Automation API* (скопируйте\nего оттуда). Кнопка **Regenerate token** мгновенно ротирует подписывающий\nсекрет: новый токен начинает работать сразу, все ранее выданные токены\nстановятся недействительными. Отдельного API-ключа и эндпоинта для выдачи\nтокенов нет; сам токен и есть учётная запись.\n\nОтсутствующий/неверный токен → `401` с пустым телом.\n\n## Типичный сценарий\n1. `GET /fingerprint/new/{platform}` → полностью уникализированный отпечаток\n   (случайная platform_version, CPU/RAM с учётом хоста, обрезанный экран,\n   шум по векторам), **не** сохраняется.\n2. При желании отредактировать возвращённый объект `fingerprint` (например,\n   включить `noise.fonts.enabled`, задать `webrtc`, поправить `navigator`).\n3. `POST /profiles` (или `POST /folders/{folder}/profiles`) с этим объектом\n   как `fingerprint` → лаунчер сохраняет его **как есть**\n   (create никогда не перерандомизирует).\n4. `POST /profiles/{id}/start` → возвращает CDP-эндпоинт; подключайтесь как\n   `browserWSEndpoint = cdp.web_socket_debugger_url`.\n5. `POST /profiles/{id}/stop` по завершении.\n\n## Прокси и QUIC/WebRTC\nПри **каждом** запуске (через UI или API), до старта браузера, привязанный\nпрокси проверяется вживую на UDP-relay (SOCKS5 UDP_ASSOCIATE). Если UDP\nработает, включается QUIC, а WebRTC может использовать проксированный\nUDP-relay. Если нет, QUIC отключается, WebRTC переводится в режим\nTCP-only, чтобы реальный IP не утёк. Поля часового пояса, локали и\nгеолокации в режиме `auto` тоже подтягиваются вживую через прокси при\nзапуске. Если передать `proxy` (строку) при постоянном создании: прокси добавляется в хранилище и проходит полный тест. Временный профиль\nхранит прокси инлайн.\n\n## Временные профили\n`POST /profiles/temporary` создаёт профиль с флагом `temporary`: он скрыт\nиз `GET /profiles` и из интерфейса лаунчера, а после закрытия браузера\nудаляется автоматически (конфиг + папка данных). Если приложение\nупадёт пока профиль открыт, он будет удалён при следующем запуске.\n\n## Объект fingerprint\n`fingerprint`, возвращаемый `GET /fingerprint/new*` и принимаемый\nэндпоинтами создания. Это нативный FingerprintConfig лаунчера. Он\nпередаётся дословно, поэтому схема ниже документирует типичные\nподобъекты, но намеренно открыта (`additionalProperties: true`).\n\n## MCP-сервер\nОтдельный **MCP** (Model Context Protocol) сервер позволяет AI-клиенту\nуправлять лаунчером через *этот* API, а браузером профиля по CDP.\nЭто самостоятельный Node-процесс; **не** часть данного HTTP API и\nне хостируется им. Скачать можно прямо из лаунчера\n(**Settings → MCP server → Download MCP server** или кнопка «Download MCP»\nв боковой панели); лаунчер сохранит исходники в выбранную папку.\nТакже доступен в репозитории: `rust/shardx-launcher/mcp/`.\n\nВнутри он просто вызывает этот API: настройте\n`SHARDX_API` (базовый URL) и `SHARDX_TOKEN` (Bearer-токен из\n*Settings → Automation API*). MCP-сервер предоставляет:\n- **API-инструменты**: тонкие обёртки над эндпоинтами ниже\n  (профили, отпечатки, прокси, папки, cookies, запуск/остановка).\n- **Браузерные инструменты** (patchright поверх CDP). `browser_navigate`,\n  `browser_evaluate`, `browser_screenshot`, `browser_click`,\n  `browser_fill`, вкладки, ожидания и т.д., применяются к профилю,\n  запущенному через `POST /profiles/{id}/start` (который возвращает\n  CDP-эндпоинт).\n\nЗапуск: либо через **stdio** (клиент стартует его сам), либо через HTTP\nна `127.0.0.1:<port>/mcp` (если задана `MCP_HTTP_PORT`). Подробнее см. README MCP-сервера. (Лаунчер только скачивает его, но не запускает.)\n"
servers:
  - url: http://127.0.0.1:40325
    description: Локальный лаунчер (порт по умолчанию; меняется в Settings)

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash
  - name: Automation

paths:
  /health:
    get:
      tags: [ System ]
      summary: Проверка доступности сервера
      description: Возвращает базовую информацию о сервере. Единственный эндпоинт, **не** требующий аутентификации.
      security: []
      responses:
        "200":
          description: Сервер работает.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.0" }

  /fingerprint/new:
    get:
      tags: [ Fingerprints ]
      summary: Сгенерировать новый отпечаток (ОС хоста)
      description: |
        Возвращает полностью уникализированный отпечаток для **хостовой**
        операционной системы без сохранения. Эквивалентно вызову
        `/fingerprint/new/{platform}` с платформой хоста.
      responses:
        "200":
          description: Уникализированный, не сохранённый отпечаток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Библиотека отпечатков пуста.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [ Fingerprints ]
      summary: Сгенерировать новый отпечаток для заданной платформы
      description: "Выбирает случайный отпечаток из библиотеки, соответствующий `platform`,\nзатем уникализирует его: новая `platform_version` для Sec-CH-UA,\n`hardware_concurrency`/`device_memory` с учётом хоста (не превышают\nреальные значения машины), экран, обрезанный под реальный дисплей.\nВозвращается без сохранения; передайте как `fingerprint` в эндпоинт создания.\n"
      parameters:
        - name: platform
          in: path
          required: true
          description: Регистронезависимо; принимаются псевдонимы `win`/`osx`/`darwin`.
          schema:
            type: string
            enum: [ Windows, macOS, Linux ]
      responses:
        "200":
          description: Уникализированный, не сохранённый отпечаток.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Подходящий отпечаток не найден или библиотека пуста.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [ Profiles ]
      summary: Список профилей
      description: "Возвращает постоянные профили (временные скрыты), от новых к старым,\nзакреплённые; вверху. Каждая запись дополнена актуальным состоянием запуска.\n"
      responses:
        "200":
          description: Список профилей.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Profiles ]
      summary: Создать профиль
      description: "Сохраняет профиль из переданного клиентом объекта `fingerprint` **ровно\nкак есть** (повторная рандомизация не выполняется; уникализация уже\nпрошла в `/fingerprint/new`). Используйте `folder`, чтобы разместить\nпрофиль в папке; привяжите прокси по `proxy_id` из хранилища или\nинлайн через `proxy` (строка, **не** сохраняется в хранилище прокси).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метаданные созданного профиля.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Отсутствует или не является объектом `fingerprint`, либо неразбираемая строка прокси.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/temporary:
    post:
      tags: [ Profiles ]
      summary: Создать временный профиль
      description: |
        Создаёт профиль из случайного (или указанного) отпечатка библиотеки,
        уникализированного как в `/fingerprint/new` и сохранённого дословно,
        с флагом `temporary`: скрыт из списков и **автоматически удаляется
        после закрытия браузера** (или при следующем запуске после краша).
        Используйте вместе с `POST /profiles/{id}/start`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: Созданный временный профиль.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: Запись библиотеки, на основе которой сгенерирован профиль.
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: Был ли прикреплён инлайн-прокси.
        "400":
          description: "Неразбираемая прокси-строка или неизвестный вектор шума."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Подходящий отпечаток не найден / пустая библиотека.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [ Profiles ]
      summary: Получить профиль
      description: "Возвращает полный сохранённый профиль: оболочку `_meta` плюс\nразвёрнутый FingerprintConfig. Если профиль запущен; добавляются\n`running` и `cdp`.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Сохранённый профиль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профиль не найден.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Profiles ]
      summary: Удалить профиль
      description: "Перемещает профиль в корзину. Его можно восстановить за 7 дней. Архив включает файлы cookie, логины, веб-данные, настройки, локальное хранилище и IndexedDB. Данные кэша исключены. Исходная конфигурация и каталог пользовательских данных удаляются после создания архива. Временные профили удаляются автоматически при закрытии браузера и не перемещаются в корзину."
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "Профиль перемещен в корзину."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: "Можно восстановить из корзины в течение 7 дней."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Ошибка при удалении.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [ Profiles ]
      summary: Редактировать профиль
      description: "Обновляет только переданные поля. Если передан `fingerprint`; он\nЗАМЕНЯЕТ сохранённый дословно (без перерандомизации).\n`folder: \"\"` убирает профиль из папки; `proxy_id: \"\"` отвязывает прокси;\nстрока `proxy` сохраняется (дедупликация) + проходит полный тест,\nзатем привязывается. Возвращает обновлённый профиль.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: Обновлённый сохранённый профиль.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: Неверный fingerprint (не объект) или неразбираемый прокси.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Профиль не найден.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [ Profiles ]
      summary: Запустить профиль (с CDP)
      description: "Запускает ShardX-браузер для профиля с включённым remote-debugging,\nподставляет часовой пояс/локаль/гео из `auto`-полей через привязанный\nпрокси и возвращает CDP-эндпоинт после того, как Chrome записал\nDevToolsActivePort. CDP включается **только** при запуске через API\n(запуски из UI не открывают отладочный порт; анти-детект не страдает).\n`cdp` равен `null`, если эндпоинт не удалось прочитать в течение\nтаймаута. Работает для обычных и временных профилей.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: Необязательно. Пустое тело запускает в графическом режиме.
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: Запустить в headless-режиме (--headless=new).
      responses:
        "200":
          description: Запущен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: PID процесса ОС. }
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]
                  cdp_error:
                    type: string
                    nullable: true
                    description: "Почему `cdp` имеет значение null. Если значение не равно null, это поле отсутствует."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Бинарный файл не настроен / не удалось запустить процесс.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [ Profiles ]
      summary: Остановить профиль
      description: |
        Отправляет браузеру сигнал graceful shutdown (SIGTERM на Unix; 5 секунд
        ожидания, затем SIGKILL). Временные профили удаляются в процессе закрытия.
        `stopped` равен `false`, если профиль не был запущен.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Команда остановки отправлена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/cookies:
    get:
      tags: [ Profiles ]
      summary: Экспортировать cookies
      description: |
        Читает хранилище cookies Chromium профиля и возвращает все cookies
        **в расшифрованном виде**. Работает как для запущенного, так и для
        остановленного профиля. Пустой массив, если профиль ни разу не запускался.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: "Печенье."
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Ошибка чтения или расшифровки БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Profiles ]
      summary: Импортировать cookies
      description: "Записывает cookies в хранилище профиля (повторно шифруя по схеме\nChromium v10). Профиль **должен быть остановлен**; запущенный браузер\nперезапишет хранилище при выходе и затрёт импорт.\n"
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ cookies ]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: Импортировано.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Количество записанных cookies. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Профиль запущен; сначала остановите его."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Ошибка записи БД cookies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [ Folders ]
      summary: Список папок
      description: Уникальные непустые теги папок среди постоянных профилей.
      responses:
        "200":
          description: Названия папок.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [ "work", "scrapers" ]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [ Folders ]
      summary: Переименовать папку
      description: Перевешивает тег на всех профилях в папке. Возвращает количество затронутых профилей.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name ]
              properties:
                name: { type: string, description: Новое название папки. }
      responses:
        "200":
          description: Переименована.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: Количество перетегированных профилей. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [ Folders ]
      summary: Удалить папку
      description: |
        Удаляет тег папки. При `delete_profiles=true` профили внутри тоже
        удаляются; иначе они переходят в «Все» (тег снимается).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: Удалить профили из папки (по умолчанию false = снять тег).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Удалена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: Количество затронутых профилей. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}/profiles:
    post:
      tags: [ Folders ]
      summary: Создать профиль в папке
      description: |
        То же, что `POST /profiles`, но папка берётся из пути
        (переопределяет `folder` в теле запроса).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Метаданные созданного профиля.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Отсутствует или не является объектом `fingerprint`, либо неразбираемая строка прокси.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fingerprints:
    get:
      tags: [ Fingerprints ]
      summary: Список отпечатков библиотеки
      description: Библиотека отпечатков на диске (GPU-пресеты), поставляемая/импортируемая лаунчером.
      responses:
        "200":
          description: Записи библиотеки.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [ Profiles ]
      summary: Список запущенных профилей
      description: Профили с живым процессом браузера, включая CDP-эндпоинт при запуске через API.
      responses:
        "200":
          description: Запущенные профили.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [ Proxies ]
      summary: Список сохранённых прокси
      description: Прокси, сохранённые в хранилище лаунчера. **Учётные данные (логин/пароль) не возвращаются.**
      responses:
        "200":
          description: Краткая информация о прокси.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Proxies ]
      summary: Добавить прокси
      description: |
        Добавляет прокси в хранилище (с дедупликацией по эндпоинту). Передайте
        строку `proxy` или явные поля `host`/`port` (+ `kind`/`username`/`password`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: Краткая информация о сохранённом прокси.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: Неразбираемый прокси / не указаны host и port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [ Proxies ]
      summary: Удалить прокси
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Удалён.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [ Extensions ]
      summary: "Список расширений"
      description: "Возвращает расширения, доступные профилям. Используйте расширение `id` в поле `extensions` `POST /profiles` или `PATCH /profiles/{id}`. Значки опущены, поскольку URL-адреса данных могут быть большими. `POST /extensions` включает значок добавленного расширения."
      responses:
        "200":
          description: "Список расширений."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Extensions ]
      summary: "Добавить расширение"
      description: "Укажите `url` или `path`. `url` может быть страницей Интернет-магазина Chrome, 32-значным идентификатором расширения или прямым URL-адресом `.crx` или `.zip`. `path` может быть локальной папкой `.crx`, `.zip` или распакованной папкой на хосте средства запуска. Имя расширения, версия, описание и значок считываются из его `manifest.json`, включая заполнители `__MSG_*__`, разрешенные с использованием локали по умолчанию."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: "Расширение добавлено. Ответ включает `icon`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: "Ни `url`, ни `path` не указаны, ссылка не является расширением, либо в магазине нет такого идентификатора."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [ Extensions ]
      summary: "Удаление расширения"
      description: "Профили содержат идентификаторы, а не копии, поэтому любой профиль, называющий это расширение, перестает загружать его при следующем запуске. Их сохраненный список остается без изменений; повторное добавление расширения не восстанавливает привязку."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Удаленный."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [ Bookmarks ]
      summary: "Список закладок"
      responses:
        "200":
          description: "Каждая закладка в папках."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Bookmarks ]
      summary: "Создать или обновить закладку"
      description: "При использовании `id` обновляется закладка; без `id` создает его. Закладка, назначенная папке, отображается на панели закладок каждого профиля в этой папке внутри **ShardX**. `folder: \"\"` применяется к каждому профилю. Изменяется только эта управляемая папка. Обновление применяется при следующем запуске профиля; работающий профиль его не видит."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: "Сохраненная закладка."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: "Требуется `url`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [ Bookmarks ]
      summary: "Удалить закладку"
      description: "Он оставляет свои профили при следующем запуске."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Удален."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [ Trash ]
      summary: "Список удаленных профилей"
      description: "Возвращает профили, заархивированные `DELETE /profiles/{id}`, сначала самые новые, со сроком окончания их восстановления. Записи с истекшим сроком действия удаляются при запуске лаунчера."
      responses:
        "200":
          description: "Мусор."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [ Trash ]
      summary: "Восстановить удаленный профиль"
      description: "Восстанавливает профиль с исходным идентификатором. Архив удаляется после восстановления профиля. Файлы cookie, логины, веб-данные, настройки, история, закладки, локальное хранилище и IndexedDB восстанавливаются. Данные кэша восстанавливаются при следующем запуске."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Восстановленный профиль."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Нет удаленного профиля с этим идентификатором."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [ Trash ]
      summary: "Удалить удаленный профиль навсегда"
      description: "Безвозвратно удаляет архив профиля. Это действие невозможно отменить."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Очищено."
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects:
    get:
      tags: [ Automation ]
      summary: "Список проектов автоматизации"
      description: "Каждый проект, сохраненный в лаунчере, со своими блоками и настройками запуска. Это те же проекты, которые редактирует десктопный раздел **Automation**."
      responses:
        "200":
          description: "Список проектов."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ Automation ]
      summary: "Создать проект"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: "Когда пусто, используется `Untitled`." }
      responses:
        "200":
          description: "Созданный проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}:
    get:
      tags: [ Automation ]
      summary: "Получить проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Детали проекта."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [ Automation ]
      summary: "Заменить проект"
      description: "Заменяет весь проект. Отправьте объект, возвращенный `GET`. Идентификатор пути имеет приоритет над идентификатором тела. Отсутствующий проект возвращает `404`; используйте `POST /automation/projects`, чтобы создать его."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationProject" }
      responses:
        "200":
          description: "Сохраненный проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Неверный объект проекта."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ Automation ]
      summary: "Удалить проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Удален."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/duplicate:
    post:
      tags: [ Automation ]
      summary: "Дублировать проект"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Дублированный проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/export:
    get:
      tags: [ Automation ]
      summary: "Экспортировать пакет проектов"
      description: "Параметры проекта, помеченные как секретные, при выходе очищаются, поэтому пакет можно передать, не взяв с собой пароль. Импортирующая сторона снова их запрашивает."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Экспортный пакет."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/import:
    post:
      tags: [ Automation ]
      summary: "Импортировать пакет проектов"
      description: "Пакет поставляется как новый проект с новым идентификатором."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationBundle" }
      responses:
        "200":
          description: "Импортированный проект."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationProject" }
        "400":
          description: "Неверный пакет или неподдерживаемая версия формата."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /automation/projects/{id}/run:
    post:
      tags: [ Automation ]
      summary: "Начать проект"
      description: "Запускает проект и немедленно возвращается. Блоки проекта запускают необходимые браузеры. Используйте `/status` для отслеживания прогресса. Возвращает `400`, если проект уже запущен или не имеет включенных шагов."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Проект стартовал."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  running: { type: boolean, example: true }
        "400":
          description: "Проект уже запущен или не имеет включенных шагов."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Проект не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/stop:
    post:
      tags: [ Automation ]
      summary: "Остановить проект"
      description: "Запрашивает остановку запуска. Каждый браузер завершает текущий шаг перед закрытием. Используйте `/status` для отслеживания поля `running`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Стоп просили."
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: { type: string, format: uuid }
                  stopping: { type: boolean, example: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/projects/{id}/status:
    get:
      tags: [ Automation ]
      summary: "Получить статус запуска проекта"
      description: "Возвращает `null`, если проект не запущен и не запускался с момента запуска лаунчера. `log` содержит последние записи, показанные в окне запусков. Полный журнал хранится в `automation-runs/`."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Статус выполнения или `null`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AutomationRun"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/runs:
    get:
      tags: [ Automation ]
      summary: "Список активных запусков"
      responses:
        "200":
          description: "Активный список запусков."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules:
    get:
      tags: [ Automation ]
      summary: "Список установленных модулей"
      description: "Возвращает установленные оператором модули WebAssembly. Каждый модуль добавляет блоки вида `module:<module id>:<block>`. Модули передают действия исполнителю и не обращаются к странице напрямую."
      responses:
        "200":
          description: "Список модулей."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [ Automation ]
      summary: "Установить модуль"
      description: "`path` должен указывать на локальный файл `.wasm` на хосте средства запуска. Модули содержат собственный код, созданный оператором."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ path ]
              properties:
                path: { type: string, example: "/home/me/module.wasm" }
      responses:
        "200":
          description: "Установленный модуль."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationModule" }
        "400":
          description: "Отсутствует путь или неподдерживаемый файл модуля."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /automation/modules/{id}:
    delete:
      tags: [ Automation ]
      summary: "Удалить модуль"
      description: "Проекты, использующие модуль, перестают работать. Существующие определения проекта не изменяются."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Удаленный."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "Модуль не найден."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "Эта сборка не поддерживает автоматизацию."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Постоянный JWT из Settings → Automation API.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: UUID профиля.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Отсутствующий или недействительный Bearer-токен.

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [ error ]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [ fingerprint ]

    Fingerprint:
      type: object
      description: "Нативный FingerprintConfig. Документированные подобъекты; наиболее\nраспространённые; объект открытый и сохраняется эндпоинтами создания\nдословно, так что любое поле здесь будет передано без изменений.\n"
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = режим только переопределений (типичный случай).
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [ 8, 16, 32 ], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: [ "", srgb, p3, rec2020 ] }
            refresh_rate:
              type: integer
              minimum: 24
              maximum: 480
              example: 60
              description: "Частота обновления заявленного экрана. Если поле не указано, используется значение 60. См. поле `refresh_rate` в запросах создания и редактирования."
        client_hints:
          type: object
          description: Семейство Sec-CH-UA (в browser.vision называется `hints`).
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: Режим обработки WebRTC.
          enum: [ auto, tcp_only, block ]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: Защита от сканирования портов локальной сети (ports_protection).
        timezone:
          type: string
          description: "Имя по IANA или \"auto\"; будет определено через привязанный прокси при запуске."

    NoisePrefs:
      type: object
      description: |
        Настройки антифингерпринт-шума по векторам. Каждый блок: `{enabled, seed}`
        (+ специфичные параметры). `enabled:false` = сквозная передача.
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        audio:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [ { $ref: "#/components/schemas/NoiseBlock" } ]
          description: |
            `enabled:true` скрывает небольшое детерминированное подмножество
            несущественных шрифтов для каждого профиля (остальные реальные шрифты
            хоста проходят насквозь).

    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: Энтропия на профиль; 0 = вычислить автоматически.

    CreateProfileRequest:
      type: object
      required: [ fingerprint ]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: Привязать прокси из хранилища (по id).
        proxy:
          type: string
          description: "Привязать прокси строкой (`host:port:user:pass` или\n`scheme://user:pass@host:port`). Для **постоянного** профиля прокси\nдобавляется в хранилище (дедупликация по эндпоинту) и проходит\nполный тест (UDP + гео), затем привязывается по id; отображается\nв списке прокси, результат QUIC/WebRTC кешируется. Для **временного**\nпрофиля прокси прикрепляется инлайн (не сохраняется). Игнорируется,\nесли задан `proxy_id`.\n"
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: "Тег папки (игнорируется для /folders/{folder}/profiles; там приоритет у пути)."
        color:
          type: string
          description: "Акцентный цвет значка окна профиля и метки с его названием в адресной строке. Если поле не указано, цвет значка определяется по имени, а метка сохраняет цвет панели инструментов браузера."
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: "Идентификаторы расширений из библиотеки (`GET /extensions`), загружаемых при запуске. Если идентификатор отсутствует в библиотеке, возвращается ошибка 400. Профиль без такого расширения не запускается автоматически."
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявленная частота обновления дисплея, записанная в `screen.refresh_rate`. Ни один веб-API не сообщает об этом; страница измеряет его по времени requestAnimationFrame, поэтому его исключение не является нейтральным; «Отсутствие» означает 60, о чем сообщает большинство машин, а не о том, что делает собственный экран хоста. Кадры можно только замедлять, поэтому эффективная скорость равна ближайшему целому разделению панели хоста на этом или меньшем уровне."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: Сохраняется дословно. Получите из /fingerprint/new и при необходимости отредактируйте.

    EditProfileRequest:
      type: object
      description: "Все поля необязательны; изменяется только переданное."
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '"" убирает профиль из папки (переводит в «Все»).' }
        proxy_id: { type: string, description: '"" отвязывает прокси.' }
        proxy:
          type: string
          description: "Строка прокси; сохраняется (дедупликация) + полный тест, затем привязывается."
        color:
          type: string
          description: "`#rrggbb`; пустая строка возвращает цвет, вычисленный по названию."
        extensions:
          type: array
          items: { type: string }
          description: "Заменяет весь список; `[]` ничего не загружает."
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявленная частота обновления дисплея применяется ПОСЛЕ `fingerprint` и записывается в `screen.refresh_rate`. Ни один веб-API не сообщает об этом; страница измеряет его по времени requestAnimationFrame, поэтому его исключение не является нейтральным; «Отсутствие» означает 60, о чем сообщает большинство машин, а не о том, что делает собственный экран хоста. Кадры можно только замедлять, поэтому эффективная скорость равна ближайшему целому разделению панели хоста на этом или меньшем уровне."
        fingerprint:
          allOf: [ { $ref: "#/components/schemas/Fingerprint" } ]
          description: При наличии ЗАМЕНЯЕТ сохранённый отпечаток дословно.

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: "Запись библиотеки, на которой основывается профиль; при отсутствии; случайный под `platform`."
        platform:
          type: string
          enum: [ Windows, macOS, Linux ]
          description: "Используется для выбора случайного отпечатка, если `fingerprint_id` не указан; при отсутствии обоих; ОС хоста."
        proxy:
          type: string
          description: Инлайн-строка прокси (не сохраняется в хранилище).
        name: { type: string }
        folder: { type: string }
        refresh_rate:
          type: integer
          minimum: 24
          maximum: 480
          example: 60
          description: "Заявленная частота обновления дисплея, записанная в `screen.refresh_rate`. Ни один веб-API не сообщает об этом; страница измеряет его по времени requestAnimationFrame, поэтому его исключение не является нейтральным; «Отсутствие» означает 60, о чем сообщает большинство машин, а не о том, что делает собственный экран хоста. Кадры можно только замедлять, поэтому эффективная скорость равна ближайшему целому разделению панели хоста на этом или меньшем уровне."
        noise:
          type: object
          description: "Шум отпечатка для каждого вектора. Пропущенные векторы сохраняют значения по умолчанию (отключены). Можно комбинировать два формата: сокращение `{\"canvas\": true, \"webgl\": true}`, которое также применяет интенсивность пользовательского интерфейса по умолчанию к `webgl` и `client_rects`, и полный объект, такой как `{\"canvas\": {\"enabled\": true, \"seed\": 42}}`, соответствующий формату, возвращаемому `GET /profiles/{id}`. Поля объединяются с существующими настройками векторов. Если `seed` не указан или равен нулю, стабильное значение создается на основе идентификатора профиля."
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "Только `webgl`." }
                  max_offset: { type: number, description: "Только `client_rects`." }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: "Передайте это в `extensions` профиля." }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`." }
        icon:
          type: string
          nullable: true
          description: "Самый большой значок, объявленный в манифесте, как URL-адрес `data:`. Значение null для конечной точки листинга и для расширений, которые не поставляются."
    AddExtensionRequest:
      type: object
      description: "Ровно один из `url` или `path`."
      properties:
        url:
          type: string
          description: "Страница Интернет-магазина Chrome, простой 32-значный идентификатор расширения или прямая ссылка на `.crx`/`.zip`."
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: "Локальная `.crx`, `.zip` или распакованная папка на компьютере лаунчера."

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: "папка лаунчера; пустой означает каждый профиль."

    BookmarkRequest:
      type: object
      required: [ url ]
      properties:
        id:
          type: string
          description: "Представлять обновления, которые добавляются в закладки; отсутствие создает его."
        url:
          type: string
          description: "Голый хост подойдет; Добавлен `https://`."
          example: facebook.com/ads/manager
        title:
          type: string
          description: "Бланк использует сам адрес."
        folder:
          type: string
          description: "Пусто (или отсутствует) означает каждый профиль."

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: "Unix-секунды." }
        expires_at:
          type: integer
          format: int64
          description: "Unix-секунды; очистка при запуске удаляет все, что находится за ней."
        size_bytes:
          type: integer
          format: int64
          description: "Архив, в котором хранится аккаунт, а не кэши."

    ProfileMeta:
      type: object
      description: Метаданные профиля в лаунчере (возвращаются при создании).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 или null. }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: "Акцент на значке как `#rrggbb`; `null` означает, что оно получено из имени, что и делает браузер, когда ничего не выбрано."
        extensions:
          type: array
          items: { type: string }
          description: "Идентификаторы библиотек расширений, загружаемые при запуске."

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    StoredProfile:
      type: object
      description: |
        Полный профиль на диске: оболочка `_meta` плюс развёрнутый
        FingerprintConfig (все поля `Fingerprint` на верхнем уровне).
        `running`/`cdp` присутствуют только во время работы профиля.
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [ { $ref: "#/components/schemas/ProxyEntry" } ]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            temporary: { type: boolean }
            rev:
              type: integer
              description: "Каждая запись увеличивает номер версии. Редактор рабочего стола передает номер версии, на котором был открыт профиль, поэтому сохранение поверх изменения, сделанного через этот API, отклоняется, а не отменяется автоматически. Изменения через API не отклоняются: профиль читается и записывается обратно за один шаг."
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    CdpInfo:
      type: object
      description: CDP-эндпоинт запущенного профиля.
      properties:
        port: { type: integer, description: Порт remote-debugging }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST-база (/json, /json/version).
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: WS-эндпоинт уровня браузера для Puppeteer/Playwright `connect`.

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CdpInfo" } ]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [ Windows, macOS, Linux ] }
        chrome: { type: string, description: Строка версии Chrome. }
        gpu: { type: string }
        builtin: { type: boolean, description: Входит в поставляемый стартовый набор. }

    AddProxyRequest:
      type: object
      description: Строка прокси ИЛИ явные поля (строка имеет приоритет).
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` или `host:port:user:pass`."
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: Сохранённый прокси без учётных данных.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: Информационный тег (например }

    Cookie:
      type: object
      description: "Cookie в удобном для инструментов виде (совместим с форматами\nEditThisCookie / Puppeteer; `httpOnly`/`sameSite` принимаются\nкак псевдонимы при импорте).\n"
      required: [ domain, name, value ]
      properties:
        domain:
          type: string
          description: Хост cookie (Chromium `host_key`), например ".example.com".
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix-секунды; null/отсутствует = сессионный cookie.
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [ Strict, Lax, None, unspecified ]
          description: Регистронезависимо при импорте.

    ProxyEntry:
      type: object
      description: Полная запись прокси (как встроено в `_meta.inline_proxy`).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ socks5, http, https ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }

    AutomationBranch:
      description: "Ветка после выполнения шага. В простых случаях используется строка, при передаче значения - объект."
      oneOf:
        - type: string
          enum: [ next, stop, endpass ]
          description: "`next`: перейти к следующему шагу. `stop`: завершить весь запуск профиля. `endpass`: завершить текущий проход и начать следующий с первого шага."
        - type: object
          properties:
            goto: { type: string, description: "Идентификатор блока для перехода. Если блока нет, используется `next`." }
        - type: object
          properties:
            retry: { type: integer, description: "Сколько дополнительных раз повторить этот шаг, затем перейти к `next`." }

    AutomationBlock:
      type: object
      description: "Один шаг автоматизации. `kind` и `params` расширяемы, поэтому модули могут добавлять новые типы шагов."
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Встроенный тип палитры (`goto`, `click`, `type`, `profile.create`, `var.set`, ...) или `module:<module id>:<block>`. В мобильном профиле обычные действия используют сенсорный ввод: `click` выполняет касание, `rightClick` - долгое нажатие, а `scroll` и `swipe` - жесты. `hover` недоступен, поскольку на мобильном устройстве нет указателя. Следующие шаги доступны только на мобильных профилях и отклоняются на компьютерах: | Тип | Параметры | Действие | | --- | --- | --- | | `touch.tap` | `selector` или `x`+`y`, `tapCount` (1-3), `timeout` | Коснуться цели. | | `touch.longPress` | `selector` или `x`+`y`, `timeout` | Нажать и удерживать. | | `touch.swipe` | `selector` или `x`+`y`, `dx`, `dy`, `timeout` | Провести пальцем. | | `touch.drag` | `selector`, `to`, `holdMs`, `timeout` | Перетащить элемент. | | `touch.pinch` | `scale`, `selector` или `x`+`y` | Масштабировать двумя пальцами. Значение выше 1 уменьшает масштаб. | | `screen.rotate` | `angle` (0/90/180/270), `turnMs`, `into` | Повернуть устройство. `into` сохраняет новый `screen.orientation.type`. |"
          example: click
        label: { type: string }
        params:
          type: object
          additionalProperties: true
          description: "Собственные поля шага, как их определяет палитра."
        enabled: { type: boolean, default: true }
        x: { type: number, description: "Положение на холсте. Только для макета, выполнение идет по веткам." }
        y: { type: number }
        on_done: { $ref: "#/components/schemas/AutomationBranch" }
        on_fail:
          allOf:
            - $ref: "#/components/schemas/AutomationBranch"
          description: "По умолчанию `stop`. Если продолжить после неудачного шага, действия могут выполняться не на той странице."
        secrets:
          type: array
          items: { type: string }
          description: "Имена параметров очищаются при экспорте."

    AutomationRunSettings:
      type: object
      properties:
        threads: { type: integer, default: 1, description: "Максимальное число одновременно работающих браузеров: от 1 до 64." }
        loops: { type: integer, default: 1, description: "Число проходов по блокам. 0 означает запуск до истечения `hours`." }
        hours: { type: number, description: "Используется только при `loops: 0`." }
        start: { type: string, description: "Идентификатор блока, с которого нужно начать; пустой означает первый." }
        profiles:
          type: array
          items: { type: string }
          description: "Для совместимости с проектами, сохраненными до появления профилей-блоков. При задании каждый профиль запускается в отдельном потоке."

    AutomationProject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/AutomationBlock" }
        run: { $ref: "#/components/schemas/AutomationRunSettings" }
        created_at: { type: integer, description: "Unix-секунды." }
        updated_at: { type: integer, description: "Unix-секунды." }

    AutomationBundle:
      type: object
      description: "Пакет проекта для переноса на другую машину."
      properties:
        format: { type: integer, example: 1, description: "Импорт отклоняет неизвестную версию формата." }
        exported_at: { type: integer, description: "Unix-секунды." }
        project: { $ref: "#/components/schemas/AutomationProject" }
        modules:
          type: array
          items: { type: string }
          description: "Идентификаторы модулей, необходимых проекту."
        module_files:
          type: array
          description: "Файлы этих модулей переносятся внутри пакета, чтобы импортированный проект мог работать там, где он находится. Модуль, отсутствующий на диске во время экспорта, здесь не указан, но все равно назван в `modules`. При импорте модуль, уже установленный под тем же идентификатором, сохраняется как есть, а не перезаписывается."
          items:
            type: object
            properties:
              id: { type: string }
              wasm: { type: string, description: "Файл .wasm, заархивированный gzip, а затем base64." }
        needs:
          type: array
          description: "Поля, очищенные при экспорте и запрашиваемые снова при импорте."
          items:
            type: object
            properties:
              block_id: { type: string }
              label: { type: string }
              params:
                type: array
                items: { type: string }

    AutomationWorker:
      type: object
      description: "Один браузер в рамках запуска."
      properties:
        profile_id: { type: string }
        profile_name: { type: string }
        pass: { type: integer, description: "Нумерация с 1; значение 0 означает, что первый проход еще не начался." }
        step: { type: integer }
        steps_total: { type: integer }
        status: { type: string, enum: [ queued, starting, running, done, failed, stopped ] }
        note: { type: string }

    AutomationRun:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        started_at: { type: integer, description: "Unix-секунды." }
        running: { type: boolean }
        workers:
          type: array
          items: { $ref: "#/components/schemas/AutomationWorker" }
        log:
          type: array
          items: { type: string }
          description: "Последние записи, показанные в окне запусков. Полный журнал хранится в `automation-runs/`."

    AutomationModule:
      type: object
      properties:
        id: { type: string, description: "Имя файла без расширения и префикс для типов блоков модуля." }
        name: { type: string }
        path: { type: string }
        blocks:
          type: array
          items: { type: object, additionalProperties: true }
          description: "Дескрипторы блоков имеют ту же форму, что и встроенная палитра."
        error: { type: string, description: "Пусто при успешной загрузке модуля, иначе содержит причину ошибки." }
